<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Inventario IT</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">💻 Inventario IT Aziendale</h1>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded shadow p-4 text-center">
      <p class="text-sm text-gray-600">Società</p>
      <p class="text-2xl font-bold text-gray-800" id="totalSocieta">0</p>
    </div>
    <div class="bg-white rounded shadow p-4 text-center">
      <p class="text-sm text-gray-600">Persone</p>
      <p class="text-2xl font-bold text-gray-800" id="totalPersone">0</p>
    </div>
    <div class="bg-white rounded shadow p-4 text-center">
      <p class="text-sm text-gray-600">Hardware Totali</p>
      <p class="text-2xl font-bold text-gray-800" id="totalPC">0</p>
    </div>
    <div class="bg-white rounded shadow p-4 text-center">
      <p class="text-sm text-gray-600">In Uso</p>
      <p class="text-2xl font-bold text-green-600" id="pcInUso">0</p>
    </div>
  </div>

  <div class="bg-white rounded shadow overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nome</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Codice</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Indirizzo</th>
        </tr>
      </thead>
      <tbody id="societaTable" class="divide-y divide-gray-200"></tbody>
    </table>
  </div>

  <!-- Firebase (compila la config al STEP 8) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "API_KEY",
      authDomain: "PROJECT_ID.firebaseapp.com",
      projectId: "PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { await signInAnonymously(auth); return; }
      loadStats(); loadSocieta();
    });

    async function loadStats(){
      const $ = (id)=>document.getElementById(id);
      const societa = await getDocs(collection(db,'companies'));
      const people  = await getDocs(collection(db,'people'));
      const assets  = await getDocs(collection(db,'assets'));
      const inUso   = await getDocs(query(collection(db,'assets'), where('status','==','In Uso')));
      $('totalSocieta').textContent = societa.size;
      $('totalPersone').textContent = people.size;
      $('totalPC').textContent = assets.size;
      $('pcInUso').textContent = inUso.size;
    }

    async function loadSocieta(){
      const snap = await getDocs(collection(db,'companies'));
      const body = document.getElementById('societaTable');
      body.innerHTML = '';
      snap.forEach(d=>{
        const r = d.data();
        body.innerHTML += `
          <tr>
            <td class="px-6 py-3">${r.name||''}</td>
            <td class="px-6 py-3">${r.code||''}</td>
            <td class="px-6 py-3">${r.address||''}</td>
          </tr>`;
      });
    }
  </script>
</body>
</html>
